name: Update Download Badge

on:
  schedule:
    - cron: '*/30 * * * *'  # every 30 minutes
  workflow_dispatch:        # manual trigger

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Get download count for Launcher.exe
        id: get_downloads
        run: |
          COUNT=$(curl -s https://api.github.com/repos/goldenboys2011/EndlessLauncher/releases \
            | jq '[.[] | .assets[] | select(.name == "Launcher.exe") | .download_count] | add')
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Generate badge JSON
        run: |
          mkdir -p assets
          echo '{
            "schemaVersion": 1,
            "label": "Launcher Downloads",
            "message": "'"${{ steps.get_downloads.outputs.count }}"'",
            "color": "brightgreen"
          }' > assets/downloads-badge.json

      - name: Commit & push badge
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add assets/downloads-badge.json
          git commit -m "Update downloads badge" || echo "No changes to commit"
          git remote set-url origin https://x-access-token:${PAT_TOKEN}@github.com/goldenboys2011/EndlessLauncher.git
          git push origin HEAD:main
