name: Update Download Badge

on:
  schedule:
    - cron: '*/5 * * * *'  # every 5 minutes
  workflow_dispatch:        # manual trigger

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}  # Needed to allow push with custom PAT

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Get download count for Launcher.exe
        id: get_downloads
        run: |
          API_RESPONSE=$(curl -s https://api.github.com/repos/goldenboys2011/EndlessLauncher/releases)
          
          if echo "$API_RESPONSE" | jq -e 'type == "array"' > /dev/null; then
            COUNT=$(echo "$API_RESPONSE" | jq '[.[] | .assets[] | select(.name == "Launcher.exe") | .download_count] | add')
          else
            echo "❌ GitHub API returned an error:"
            echo "$API_RESPONSE"
            COUNT=0
          fi
      
          echo "count=$COUNT" >> $GITHUB_OUTPUT


      - name: Generate badge JSON
        run: |
          mkdir -p assets
          echo '{
            "schemaVersion": 1,
            "label": "Launcher Downloads",
            "message": "'"${{ steps.get_downloads.outputs.count }}"'",
            "color": "brightgreen"
          }' > assets/downloads-badge.json

      - name: Commit and push badge
        uses: EndBug/add-and-commit@v9
        with:
          add: 'assets/downloads-badge.json'
          message: 'Update downloads badge'
          default_author: github_actions
